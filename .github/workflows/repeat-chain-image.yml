# Builds the repeat-chain image (docker/Dockerfile) and publishes it to the GitHub container registry:
#   ghcr.io/re-peat-project/repeat-chain:latest       the head of main
#   ghcr.io/re-peat-project/repeat-chain:sha-<commit> every build, for a run that must be repeatable
# Runs when the chain's code, settings or locks change on main, or by hand (Actions, "Run workflow").
# After the build, the image's own check (`setup`) must pass, or nothing is pushed under `latest`.
name: repeat-chain image

on:
  push:
    branches: [main]
    paths: ["docker/**", "env/**", "tools/**", "sites/**", "pipeline.yaml", ".github/workflows/repeat-chain-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: repeat-chain-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/re-peat-project/repeat-chain

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space (the image is about 9 GB unpacked)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Re-Peat-Project/re-peat
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=RE-PEAT chain: DEM preparation to canal-block plan, per KHG
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image (repositories, interpreters, package locks)
        run: |
          docker run --rm ${{ env.IMAGE }}:sha-${{ github.sha }} setup | tee setup.txt
          grep -q '^ready' setup.txt
          ! grep -q 'DIFFERS' setup.txt

      - name: Push
        run: |
          docker tag ${{ env.IMAGE }}:sha-${{ github.sha }} ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:sha-${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest
