# Every setting one KHG can change. Generated by `python tools/khg_pipeline.py config catalogue`; do not edit by hand.
#
# Use: a file per KHG with only the lines you change, '# ' removed, and why and when as a comment:
#   Docker (docs/22): REPEAT_DIR/config/overrides/<code>.yaml (e.g. 14.08.04.yaml)
#   in the repository (tracked, shared with the team): re-peat/sites/<folder>/overrides.yaml
# They win over pipeline.yaml, your settings file and the generated khg.yaml. After a change, rerun from the first step
# it affects: `run --khg <code> --from <step>` (docs/23-configuring-a-run.md).

# ---- the KHG's own data: these replace the values of the generated sites/<folder>/khg.yaml
# peat_depth:
  # Source (Sumber) Where the KHG's peat depth comes from Allowed: modelled raster, FEG 50k classes, BBSDLP classes, PEATGRIDS (low confidence).
  # source: modelled raster
  # Raster (Raster) Peat-depth raster (modelled raster, or your own file)
  # path: ${REPEAT_DATA}/my_peat_depth.tif
  # Scale to metres (Faktor ke meter) Raster value x scale = depth in m (0.01 for cm) Allowed: > 0.
  # scale: 0.01
# dems:                            # per DEM variant: lidar, deltadtm, demnas
#   lidar:
    # Clip (Potongan) The DEM clipped to the KHG (01_dem/inputs)
    # clip: null
    # Skip (reason) (Lewati (alasan)) The variant does not run, for this reason
    # skip: LiDAR left out of this test (2026-11-11)
# canals:
  # Canal class field (Kolom kelas kanal) Field with Kanal Primer / Sekunder / Tersier
  # class_field: KET_KANAL

# ---- step settings for this KHG only: any key of the step sections of pipeline.yaml (values below are the national ones)
# steps:
#   dem_correction:
    # Correction templates (Templat koreksi) repeat-dem config per DEM; {dem} is replaced
    # templates: tools/pipeline/templates/dem_correction_{dem}.yaml
    # ICESat-2 period (Periode ICESat-2) First and last day of the ICESat-2 ATL08 ground points used
    # icesat2_period: ['2019-01-01', '2025-12-31']
#   delineation:
    # Outlet canal classes (Kelas kanal outlet) Canal classes whose ends become outlets of sub-KHG units
    # outlet_canal_classes: [Kanal Primer, Kanal Sekunder]
    # Minimum unit area (Luas unit minimum) Smallest sub-KHG unit; `auto` aims at 6-30 units per KHG Unit: km². Allowed: auto; or > 0.
    # min_area_km2: auto
    # Merge rule (Aturan penggabungan) Small pieces merge into the neighbour with the longest shared border (adjacent) or preferably across the divide (flow) Allowed: adjacent, flow.
    # merge: adjacent
#   neraca:
    # Rainfall product (Produk curah hujan) Rainfall source of the water balance Allowed: chirps, imerg, terraclimate_pr.
    # rain: chirps
    # Evapotranspiration products (Produk evapotranspirasi) ET sources; the balance reports each Allowed: wapor, mod16, mod16nrt, terraclimate_aet.
    # et: [mod16, wapor]
    # Start date (Tanggal mulai) First day of the balance
    # start: '2018-01-01'
    # End date (exclusive) (Tanggal akhir (eksklusif)) First day after the last complete dekad
    # end: '2026-10-01'
    # Parallel requests (Permintaan paralel) Parallel Earth Engine requests Allowed: ≥ 1; ≤ 32.
    # workers: 8
    # Deficit window (Jendela defisit) SiTMAT window of the KHG deficit
    # window: ['2026-04-01', '2026-10-15']
#   prioritisation:
    # Years (Tahun) Baseline, validation and El Niño years
    # years: {baseline: [2015, 2022], elnino: [2015, 2019], validation: [2023]}
    # NDMI resolution (Resolusi NDMI) Grid of the Sentinel-2 moisture index Unit: m. Allowed: > 0.
    # ndmi_res_m: 20
    # Canal classes for the IPG (Kelas kanal untuk IPG) Canals counted in the drainage indicator
    # ipg_canal_classes: [Kanal Primer, Kanal Sekunder]
    # National profile config (Konfigurasi profil nasional) repeat-prioritisation national profile
    # national_profile: ${WORKSPACE}/repeat-prioritisation/configs/examples/national_profile.yaml
#   pump:
    # Include tertiary canals (Sertakan kanal tersier) Off by default, as in the KLH guide
    # tertiary: false
    # Print layouts (Tata letak cetak) KLH print layouts (need QGIS)
    # layouts:
      # Paper sizes (Ukuran kertas) KLH print layouts Allowed: A0, A1, A2, A3, A4.
      # papers: [A3, A0]
      # Orientation (Orientasi) Page orientation Allowed: landscape, portrait.
      # orient: [landscape]
    # Pump run-config values (Nilai konfigurasi pompa) Any key of repeat-pump's run config, dotted (e.g. interventions.held_target: 0.6); wins over the template and the proposed defaults; checked against repeat_pump.core.config.Config
    # set: {optimise.enabled: true, pumping.enabled: false, run.subkhg_selection.n: 5}
