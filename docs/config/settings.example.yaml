# Every national setting of the chain, at the value pipeline.yaml holds now. Generated by
# `python tools/khg_pipeline.py config catalogue` from tools/pipeline/schema.py; do not edit by hand.
#
# Use: copy the lines you want to change into your own settings file, remove the leading '# ' and set the value.
#   Docker (docs/22): REPEAT_DIR/config/settings.yaml      a workstation: re-peat/pipeline.local.yaml
# Anything you leave out keeps the value below. Check with `config validate`, see the result with `config show --khg <code>`.
# Keys of the pump's own run config go under pump.set: docs/config/pump-settings.md lists them all.
# Machine settings (workspace, data, khg_root, python, environment) are left out: the container sets them.

# Selected KHG list (Daftar KHG terpilih) CSV of the selected KHG
# khg_list: sites/selected_khg.csv
# Extra KHG (KHG tambahan) Codes added to the list
# extra_khg: [14.02-04-05.01]
# national:
  # KHG boundaries (Batas KHG) KHG polygons (SK.129/MENLHK/2017), matched by registry code
  # boundary: {path: batas_khg_indonesia.gpkg}
  # Canals (Kanal) Canal lines with a class field (Kanal Primer / Sekunder / Tersier)
  # canals: {path: kanal_osgm_khg_existing_Indonesia.gpkg}
  # Rivers (Sungai) River lines (RBI)
  # rivers: {path: RBI_sungai.gpkg}
  # Lakes (Danau dan waduk) Lakes and reservoirs (RBI)
  # lakes: {path: RBI_wadukdanau.gpkg}
  # Existing canal blocks (Sekat kanal eksisting) Built canal blocks (BRGM)
  # blocks: {path: infrastruktur_hidrologis_existing_BRGM_Indonesia.gpkg, where: Jenis == 'Sekat Kanal' and KETERANGAN == 'REALISASI'}
  # Burnt area (Area terbakar) Burnt-area polygons with year
  # burnt_area: {path: burnt_area_2015_2026_Indonesia.gpkg}
  # Protected peat function (Fungsi lindung gambut) FEG polygons with the protection class
  # protected: {field: FEG_KGHLTR, path: landstatus/FEG__Indonesia__2017__Rev_Tipologi.gpkg, values: [Indikatif Fungsi Lindung E.G.]}
  # Peat-depth raster folders (Folder raster kedalaman gambut) Folders searched for one modelled peat-depth raster per KHG (found by overlap)
  # peat_depth_dirs: [Peat depth and DTM/PeatDepth_Sumatera, Peat depth and DTM/PeatDepth_Kalimantan]
  # LiDAR folders (Folder LiDAR) Folders holding airborne LiDAR DTMs
  # lidar_dirs: [lidar_klhk]
# dems:
  # DEMs the chain knows (DEM yang dikenal) Every DEM variant; the chain runs once per DEM Allowed: lidar, deltadtm, demnas.
  # variants: [lidar, deltadtm, demnas]
  # DEMs run by default (DEM bawaan) Variants run when `run` gets no --dem. DEMNAS is optional: its sheets download only with the user's own Tanahair link (TANAHAIR_LINK) Allowed: lidar, deltadtm, demnas.
  # default: [lidar, deltadtm]
  # Minimum DEM coverage (Cakupan DEM minimum) A variant runs only when its DEM covers at least this share of the KHG Unit: %. Allowed: > 0; ≤ 100.
  # min_cover_pct: 90
# Steps (Langkah) The steps, in order Allowed: inputs, dem_inputs, icesat2, local_inputs, dem_correction, delineation, deficit, neraca, prioritisation, pump, layouts.
# steps: [inputs, dem_inputs, icesat2, local_inputs, dem_correction, delineation, deficit, neraca, prioritisation, pump, layouts]
# dem_correction:
  # Correction templates (Templat koreksi) repeat-dem config per DEM; {dem} is replaced
  # templates: tools/pipeline/templates/dem_correction_{dem}.yaml
  # ICESat-2 period (Periode ICESat-2) First and last day of the ICESat-2 ATL08 ground points used
  # icesat2_period: ['2019-01-01', '2025-12-31']
# delineation:
  # Outlet canal classes (Kelas kanal outlet) Canal classes whose ends become outlets of sub-KHG units
  # outlet_canal_classes: [Kanal Primer, Kanal Sekunder]
  # Minimum unit area (Luas unit minimum) Smallest sub-KHG unit; `auto` aims at 6-30 units per KHG Unit: km². Allowed: auto; or > 0.
  # min_area_km2: auto
  # Merge rule (Aturan penggabungan) Small pieces merge into the neighbour with the longest shared border (adjacent) or preferably across the divide (flow) Allowed: adjacent, flow.
  # merge: adjacent
# neraca:
  # Rainfall product (Produk curah hujan) Rainfall source of the water balance Allowed: chirps, imerg, terraclimate_pr.
  # rain: chirps
  # Evapotranspiration products (Produk evapotranspirasi) ET sources; the balance reports each Allowed: wapor, mod16, mod16nrt, terraclimate_aet.
  # et: [mod16, wapor]
  # Start date (Tanggal mulai) First day of the balance
  # start: '2018-01-01'
  # End date (exclusive) (Tanggal akhir (eksklusif)) First day after the last complete dekad
  # end: '2026-10-01'
  # Parallel requests (Permintaan paralel) Parallel Earth Engine requests Allowed: ≥ 1; ≤ 32.
  # workers: 8
  # Deficit window (Jendela defisit) SiTMAT window of the KHG deficit
  # window: ['2026-04-01', '2026-10-15']
# prioritisation:
  # Years (Tahun) Baseline, validation and El Niño years
  # years: {baseline: [2015, 2022], elnino: [2015, 2019], validation: [2023]}
  # NDMI resolution (Resolusi NDMI) Grid of the Sentinel-2 moisture index Unit: m. Allowed: > 0.
  # ndmi_res_m: 20
  # Canal classes for the IPG (Kelas kanal untuk IPG) Canals counted in the drainage indicator
  # ipg_canal_classes: [Kanal Primer, Kanal Sekunder]
  # National profile config (Konfigurasi profil nasional) repeat-prioritisation national profile
  # national_profile: ${WORKSPACE}/repeat-prioritisation/configs/examples/national_profile.yaml
# pump:
  # Include tertiary canals (Sertakan kanal tersier) Off by default, as in the KLH guide
  # tertiary: false
  # Print layouts (Tata letak cetak) KLH print layouts (need QGIS)
  # layouts:
    # Paper sizes (Ukuran kertas) KLH print layouts Allowed: A0, A1, A2, A3, A4.
    # papers: [A3, A0]
    # Orientation (Orientasi) Page orientation Allowed: landscape, portrait.
    # orient: [landscape]
  # Pump run-config values (Nilai konfigurasi pompa) Any key of repeat-pump's run config, dotted (e.g. interventions.held_target: 0.6); wins over the template and the proposed defaults; checked against repeat_pump.core.config.Config
  # set: {optimise.enabled: true, pumping.enabled: false, run.subkhg_selection.n: 5}
