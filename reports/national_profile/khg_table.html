<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KHG table</title>
<style>:root{color-scheme:light;
  --page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,.10);
  --hist:#2a78d6;--now:#eb6834;--canal:#1baf7a;--cmp:#c2307a;--wash:rgba(42,120,214,.08);
  --ramp0:#cde2fb;--ramp1:#0d366b;--burn0:#6e625a;--burn1:#17120f;--peat:#a58660;--none:#e8e7e1;--icon-filter:none;--shadow:0 4px 18px rgba(0,0,0,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;
  --page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.10);
  --hist:#3987e5;--now:#d95926;--canal:#199e70;--cmp:#d94fa8;--wash:rgba(57,135,229,.14);--ramp0:#184f95;--ramp1:#cde2fb;--burn0:#a89d94;--burn1:#f3eee9;--peat:#8a6d4b;--none:#262624;--icon-filter:invert(1);--shadow:0 4px 18px rgba(0,0,0,.5)}}
:root[data-theme=dark]{color-scheme:dark;
  --page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.10);
  --hist:#3987e5;--now:#d95926;--canal:#199e70;--cmp:#d94fa8;--wash:rgba(57,135,229,.14);--ramp0:#184f95;--ramp1:#cde2fb;--burn0:#a89d94;--burn1:#f3eee9;--peat:#8a6d4b;--none:#262624;--icon-filter:invert(1);--shadow:0 4px 18px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:22px;line-height:1.2;margin:0}
h2{font-size:14px;font-weight:600;margin:0}
.sub{margin:2px 0 0;color:var(--ink2);font-size:13px}
header.top{max-width:1680px;margin:0 auto;padding:18px 20px 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.top-actions{display:flex;gap:8px}
button,select,input[type=range]{font:inherit}
button{background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:4px 12px;cursor:pointer}
button:hover{border-color:var(--hist)}
button.ghost{background:transparent}
button.wide{width:100%;margin-top:10px}
select{background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:4px 8px;max-width:360px}
.bar{max-width:1680px;margin:0 auto;padding:8px 20px 12px;display:flex;flex-wrap:wrap;gap:10px 26px;align-items:center;border-bottom:1px solid var(--border)}
.ctl{display:flex;align-items:center;gap:8px}
.lab{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.seg{display:inline-flex;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:3px 10px;background:transparent;font-size:13px}
.seg button+button{border-left:1px solid var(--border)}
.seg button.on{background:var(--ink);color:var(--surface)}
output{min-width:44px;font-variant-numeric:tabular-nums;color:var(--ink2)}
input[type=range]{accent-color:var(--ink);width:150px}
.grid{max-width:1680px;margin:14px auto 0;padding:0 20px;display:grid;grid-template-columns:250px minmax(400px,.95fr) minmax(460px,1.1fr);gap:14px;align-items:stretch}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.side .card{display:flex;flex-direction:column}
#mapcard{flex:1 1 0}
#bumpcard{flex:1.05 1 0}
#controls{display:flex;flex-direction:column}
#sliders{flex:1;display:flex;flex-direction:column}
#sliders>div{display:flex;flex-direction:column;justify-content:space-evenly}
#sliders>div>.gs{margin:6px 0 0}
#controls .wide{margin-top:12px}
.gs{margin:10px 0 4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px}
.sl{display:grid;grid-template-columns:1fr 44px;gap:0 8px;align-items:center;margin:5px 0}
.sl label{font-size:13px;grid-column:1/3}
.sl input{width:100%}
.sl output{text-align:right}
.hist .sw,.hist input{accent-color:var(--hist)}.now input{accent-color:var(--now)}.canal input{accent-color:var(--canal)}
.legend-row{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:0 0 6px}
.legend-row .sw{margin-right:5px;vertical-align:-1px}
.rank-list{position:relative}
.row{position:absolute;left:0;right:0;height:26px;display:grid;grid-template-columns:28px minmax(150px,270px) 1fr 40px 40px;align-items:center;gap:8px;cursor:pointer;border-radius:6px;transition:transform .45s cubic-bezier(.2,.7,.2,1),opacity .3s}
.row:hover,.row.sel{background:var(--wash)}
.row .rk{color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.row .nm small{color:var(--muted);margin-left:6px}
.row .bar-wrap{height:14px;position:relative}
.row .bar-wrap svg{width:100%;height:14px;display:block}
.row .sc{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.row .dl{text-align:left;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.row.exit{opacity:0}
.tablewrap{overflow:auto;max-height:620px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:3px 8px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface)}
#rank-table td:nth-child(n+2):nth-child(-n+4),#rank-table th:nth-child(n+2):nth-child(-n+4){text-align:left}
/* profile data tables: label column left, numbers right, wrapped headers, side by side */
#p-table{display:flex;flex-wrap:wrap;gap:14px 32px;align-items:flex-start}
#p-table table{width:auto}
#p-table table.wide{width:100%}
#p-table th{white-space:normal;vertical-align:bottom;line-height:1.2;max-width:110px}
#p-table .dt th:first-child,#p-table .dt td:first-child{text-align:left}
#p-table tbody tr{cursor:default}
.ovact table.t4 th:nth-child(-n+4),.ovact table.t4 td:nth-child(-n+4){text-align:left}
#map{width:100%;flex:1 1 0;min-height:300px;position:relative;border-radius:10px;overflow:hidden;background:var(--none)}
.map-legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);margin-top:6px}
.map-legend .ramp{height:8px;width:160px;border-radius:4px}
#bump{width:100%;flex:1 1 0;height:0;min-height:300px;display:block}
.hint{font-size:12px;color:var(--muted)}
.profile{max-width:1640px;margin:14px auto 0}
.profile{margin-left:20px;margin-right:20px}
@media (min-width:1720px){.profile{margin-left:auto;margin-right:auto}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{border:1px solid var(--border);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--ink2)}
.pick{font-size:13px;color:var(--ink2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:6px 0 12px}
.kpi{border:1px solid var(--border);border-radius:10px;padding:8px 12px}
.kpi .v{font-size:26px;line-height:1.1;font-weight:600}
.kpi .v small{font-size:13px;font-weight:400;color:var(--ink2);margin-left:6px}
.kpi .l{font-size:12px;color:var(--muted);margin-top:2px}
.map-tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer;user-select:none;color:var(--ink2)}
.tg.off{opacity:.45}
.tg i{display:inline-block;width:12px;height:3px;border-radius:2px}
.tg i.dot{width:9px;height:9px;border-radius:50%}
.foot{font-size:12px;color:var(--muted);margin-top:6px}
#p-strips{margin-bottom:10px}
.strip{display:grid;grid-template-columns:182px 1fr 112px;gap:10px;align-items:center;height:26px}
.strip .t{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.strip .t b{font-weight:400;color:var(--muted);margin-left:4px}
.strip svg{width:100%;height:22px;display:block}
.strip .n{font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.strip .n small{color:var(--muted)}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px;margin-top:14px}
.charts .ch{min-width:0}
.ch h3{font-size:12.5px;font-weight:600;margin:0 0 2px}
.ch svg{width:100%;display:block;overflow:visible}
.ch.wide{grid-column:1/-1}
details.data{margin-top:12px}
details summary{cursor:pointer;color:var(--ink2);font-size:13px}
#tip{position:fixed;z-index:20;pointer-events:none;display:none;background:var(--surface);color:var(--ink);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:8px;padding:6px 10px;font-size:12.5px;max-width:280px}
#tip span{color:var(--ink2)}
dialog{border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--ink);max-width:640px;padding:0}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg{padding:18px 22px}
.dlg ul{margin:8px 0 0;padding-left:18px}
.dlg li{margin:5px 0;color:var(--ink2)}
.dlg .close{float:right}
.axis path,.axis line{stroke:var(--axis);shape-rendering:crispEdges}
.axis text{fill:var(--muted);font-size:11px}
.gridl line{stroke:var(--grid)}
.gridl path{display:none}
svg text{font-family:inherit}
@media (max-width:1180px){.grid{grid-template-columns:1fr}#controls{position:static}.p-mid{grid-template-columns:1fr}.charts{grid-template-columns:repeat(2,minmax(0,1fr))}.ch.wide{grid-column:1/-1}}
@media (max-width:760px){.charts{grid-template-columns:1fr}.p-maps.two{grid-template-columns:1fr}}
@media (forced-colors:active){.row.sel{outline:2px solid Highlight}}
.maplibregl-ctrl-group{background:var(--surface)!important;box-shadow:none!important;border:1px solid var(--border)}
.maplibregl-ctrl-icon{filter:var(--icon-filter)}
.maplibregl-ctrl-attrib{background:color-mix(in srgb,var(--surface) 80%,transparent)!important;color:var(--ink2)!important;font-size:11px}
.maplibregl-ctrl-attrib a{color:var(--ink2)!important}
.hasTip{text-decoration:underline dotted var(--muted);text-underline-offset:3px;cursor:help}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
th .arr{display:inline-block;min-width:12px;margin-left:3px;font-size:10px;color:var(--ink2)}
tbody tr{cursor:pointer}
tbody tr:hover,tbody tr.sel{background:var(--wash)}
.tbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:0 0 8px}
.tbar input[type=search]{flex:1 1 220px;min-width:180px;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:5px 10px;font:inherit}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2)}
.strip .t.hasTip{text-decoration:none}
.strip .t.hasTip:hover{text-decoration:underline dotted var(--muted);text-underline-offset:3px}
.grid.tablemode #rank{grid-column:2/4}
.grid.tablemode .side{display:none}
.grid.tablemode .tablewrap{max-height:70vh}
.ovp{margin-bottom:12px}
.ovp:empty{display:none}
.ovhead h3{font-size:13px;font-weight:600;margin:0 0 6px}
.ovgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.ovt{font-size:12.5px;font-weight:600;margin:0 0 3px}
.ovleg{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:11.5px;color:var(--ink2);margin-bottom:4px}
.ovleg .sw{margin-right:4px;vertical-align:-1px}
.ovleg small{color:var(--muted)}
.ovrow{display:grid;grid-template-columns:104px 1fr 64px;gap:8px;align-items:center;height:20px}
.ovl{font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ovv{font-size:11.5px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ovbar{display:flex;gap:2px;height:12px;background:var(--grid);border-radius:3px;overflow:hidden}
.ovbar i{display:block;min-width:1px}
.ovact{margin-top:12px}
.ovact table{font-size:12px}
.ovact td,.ovact th{padding:2px 8px}
.ovact th{white-space:normal;vertical-align:bottom;line-height:1.25}
#p-ov-leg{margin:6px 0 0;min-height:0}
#p-ov-leg:empty{display:none}
.ovact th:nth-child(-n+2),.ovact td:nth-child(-n+2){text-align:left}
.tg::before{content:"";flex:none;width:10px;height:10px;border:1.5px solid var(--ink2);border-radius:3px;background:var(--ink2)}
.tg.off::before{background:transparent}
.tg i.poly{width:12px;height:9px;border-radius:2px}
.map-tools{align-items:center}
#mapcard .map-tools{margin-bottom:6px}
.map-tools .lab{margin-right:2px}
.tgrp{display:flex;flex-basis:100%;align-items:center;gap:6px;flex-wrap:wrap}
.zr{cursor:pointer}.zr:hover td{background:var(--wash)}
/* ranking table: two-line headers with the unit, fixed first columns while the rest scrolls, province clipped */
#rank-table th{white-space:normal;vertical-align:bottom;line-height:1.2;min-width:88px;max-width:120px}
#rank-table th small{display:block;font-weight:400;font-size:10.5px;color:var(--muted)}
#rank-table td:nth-child(3){max-width:128px;overflow:hidden;text-overflow:ellipsis}
#rank-table th:nth-child(-n+2),#rank-table td:nth-child(-n+2){position:sticky;background:var(--surface);z-index:1}
#rank-table th:nth-child(1),#rank-table td:nth-child(1){left:0;min-width:36px;width:36px}
#rank-table th:nth-child(2),#rank-table td:nth-child(2){left:36px;min-width:230px;border-right:1px solid var(--grid)}
#rank-table th:nth-child(-n+2){z-index:3}
#rank-table th:nth-child(2),#rank-table td:nth-child(2){text-align:left}
#rank-table tr.sel td:nth-child(-n+2),#rank-table tbody tr:hover td:nth-child(-n+2){background:linear-gradient(var(--wash),var(--wash)),var(--surface)}
/* month range of the hotspot points: two thumbs on one track */
.dr{position:relative;display:inline-block;width:150px;height:20px;vertical-align:middle;margin:0 8px}
.dr::before{content:"";position:absolute;left:0;right:0;top:9px;height:3px;border-radius:2px;background:var(--grid)}
.dr .trk{position:absolute;top:9px;height:3px;border-radius:2px;background:var(--now)}
.dr input{position:absolute;left:0;top:0;width:100%;height:20px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.dr input::-webkit-slider-runnable-track{background:none;height:20px}
.dr input::-moz-range-track{background:none}
.dr input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:all;width:14px;height:14px;margin-top:3px;border-radius:50%;background:var(--surface);border:2px solid var(--now);cursor:pointer}
.dr input::-moz-range-thumb{pointer-events:all;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--now);cursor:pointer}
.drl{display:inline-block;min-width:74px}
button.ghost.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dr input:focus{outline:none}.dr input:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--wash)}.dr input:focus-visible::-moz-range-thumb{box-shadow:0 0 0 3px var(--wash)}

/* comparison KHG: magenta marker next to the selected KHG, text stays in ink */
.pickrow{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.kpi .c{display:flex;align-items:center;gap:0;font-size:12px;color:var(--ink2);margin-top:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.kpi .c span{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.kpi .c b{flex:none;margin-left:6px;font-weight:600;color:var(--ink)}
.kpi .c i{flex:none}
.kpi .c i,.cv i,.cap i{display:inline-block;width:8px;height:8px;border-radius:50%;border:2px solid var(--cmp);margin-right:5px;vertical-align:0;box-sizing:border-box}
#p-strips.cmp .strip{grid-template-columns:182px 1fr 156px}
.strip .n .cv{margin-left:6px;color:var(--ink2)}
.ch .cap,.lc-cap{font-size:11.5px;color:var(--ink2);margin:6px 0 2px}
#p-table caption{caption-side:top;text-align:left;font-size:12px;color:var(--ink2);padding:0 0 4px}
#p-charts .hint.nocmp{grid-column:1/-1;margin:0}
.hmrow{display:flex;gap:18px;flex-wrap:wrap}
.hm{flex:1 1 260px;min-width:0;max-width:430px}
.hm svg{width:100%;height:auto;display:block}
.hmleg{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:4px}
.hmleg .ramp{height:8px;width:120px;border-radius:4px}
/* profile maps: full width above the strips and charts; a second map opens beside the first when a KHG is compared */
.p-maps{display:grid;grid-template-columns:1fr;gap:12px}
.p-maps.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.p-mapc{min-width:0}
.p-mapc[hidden]{display:none}
.mcap{font-size:12.5px;font-weight:600;margin:0 0 4px}
.mcap:empty{display:none}
#p-map,#p-map2{width:100%;height:500px;position:relative;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--none)}
.p-mid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px 24px;align-items:start;margin-top:14px}
.p-mid .ovp{margin-bottom:0}
.p-left{min-width:0}
#p-strips{max-width:900px}
.p-mid:has(#p-ov-panel:empty){grid-template-columns:minmax(0,1fr)}
.p-mid:has(#p-ov-panel:empty) .charts{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1180px){.p-mid,.p-mid:has(#p-ov-panel:empty){grid-template-columns:minmax(0,1fr)}.p-mid:has(#p-ov-panel:empty) .charts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.p-mid:has(#p-ov-panel:empty) .charts{grid-template-columns:minmax(0,1fr)}}

.nav{display:flex;gap:4px;margin-top:6px}
.nav a{font-size:13px;color:var(--ink2);text-decoration:none;border:1px solid var(--border);border-radius:999px;padding:2px 12px}
.nav a.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* final prioritisation: type colours (light / dark), matrix, table, profile block, export dialog */
:root{--tyA:#d1495b;--tyB:#7b3fa0;--tyC:#e8a33d;--tyD:#2f8f6b;--tyE:#8d8a80}
:root[data-theme=dark]{--tyA:#e8667a;--tyB:#a97bd0;--tyC:#efb55d;--tyD:#47b48a;--tyE:#a8a59c}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--tyA:#e8667a;--tyB:#a97bd0;--tyC:#efb55d;--tyD:#47b48a;--tyE:#a8a59c}}
.card.final{max-width:1640px;margin:10px auto 6px}
.final h3{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:4px 0 8px;font-weight:600}
.final-top{display:grid;grid-template-columns:minmax(300px,.9fr) minmax(360px,1.1fr) minmax(260px,.8fr);gap:18px 28px;align-items:start}
@media (max-width:1100px){.final-top{grid-template-columns:minmax(0,1fr)}}
.fmx{display:grid;grid-template-columns:18px 1fr;grid-template-rows:1fr auto;gap:4px}
.fmx-y{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;color:var(--muted);text-align:center}
.fmx-x{grid-column:2;font-size:12px;color:var(--muted);text-align:center}
.fmx-grid{display:grid;grid-template-columns:58px repeat(3,minmax(0,1fr));gap:4px;align-items:stretch}
.fmx-rl,.fmx-cl{font-size:12px;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.fmx-rl{justify-content:flex-end;padding-right:6px}
.fmx-c{border:1px solid var(--border);border-radius:8px;min-height:58px;padding:5px;display:flex;flex-wrap:wrap;gap:4px;align-content:center;justify-content:center}
.fmx-t{border:0;border-radius:6px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--ink);font-weight:700;padding:3px 8px;font-size:13px}
.fmx-t b{font-weight:400;margin-left:6px;font-variant-numeric:tabular-nums}
.fmx-t:hover{background:color-mix(in srgb,var(--c) 34%,transparent)}
.fmx-0{color:var(--muted);font-size:12px}
.tyb{display:inline-block;min-width:22px;text-align:center;border-radius:6px;background:var(--c);color:#fff;font-weight:700;font-size:12px;padding:1px 6px}
.tyb.big{font-size:20px;min-width:38px;padding:4px 10px}
.ftypes{width:100%;border-collapse:collapse;font-size:13px}
.ftypes td,.ftypes th{padding:4px 6px;text-align:left;white-space:nowrap}
.ftypes th{white-space:normal;vertical-align:bottom;font-size:12px}
.ftypes tr[data-ty]{cursor:pointer}
.ftypes tr.on td{background:var(--wash)}
.hb{display:inline-block;height:8px;border-radius:2px;margin-right:6px;vertical-align:0;opacity:.85}
.kpis.one{grid-template-columns:minmax(0,1fr)}
.final-ctl{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 6px;flex-wrap:wrap}
#final-ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fq{font:inherit;padding:3px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink)}
#final-table{max-height:440px}
.ftab{width:100%;border-collapse:collapse;font-size:13px}
.ftab th{cursor:pointer;text-align:left;white-space:nowrap;padding:5px 8px}
.ftab th.on{color:var(--ink)}
.ftab td{text-align:left;padding:4px 8px;border-top:1px solid var(--grid);vertical-align:middle;white-space:nowrap}
.ftab td small{color:var(--muted);margin-left:6px}
.ftab td.num{text-align:right;font-variant-numeric:tabular-nums}
.ftab tr[data-id]{cursor:pointer}
.ftab tr[data-id]:hover td{background:var(--wash)}
.ftab tr.sel td{background:color-mix(in srgb,var(--now) 14%,transparent)}
.ftab tr.small td{opacity:.72}
.fbar{display:inline-block;position:relative;width:76px;height:8px;border-radius:4px;background:var(--grid);vertical-align:middle}
.fbar b{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--ink2)}
.fbar i{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--surface)}
.fbar.na{background:none;width:auto;height:auto;color:var(--muted);font-size:12px}
.fnum{display:inline-block;width:34px;text-align:right;margin-left:6px;font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink2)}
.pfinal{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:8px 0 10px;display:grid;grid-template-columns:minmax(240px,1fr) minmax(260px,1fr);gap:8px 24px}
.pfinal:empty{display:none}
.pfinal .hint{grid-column:1/-1;margin:0}
.pf-h{display:flex;gap:12px;align-items:center}
.pf-d{display:grid;gap:5px}
.pf-r{display:grid;grid-template-columns:170px 140px 44px;justify-content:start;align-items:center;gap:6px;font-size:13px}
.pf-r .fbar{width:140px}
@media (max-width:760px){.pfinal{grid-template-columns:minmax(0,1fr)}}
dialog#export{max-width:760px}
.exportl{list-style:none;padding:0!important;margin:10px 0!important}
.exportl li{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:8px 0;border-top:1px solid var(--grid)}
.exportl li span{color:var(--ink2);font-size:13px}
.exportl small{color:var(--muted)}
.exportl .src{font-family:ui-monospace,Consolas,monospace;font-size:11px}

/* merged KHG priority card: map and summary on top, weights and list below; dimension colours */
:root{--dim-u:#d1495b;--dim-s:#2f8f6b;--dim-c:#7b3fa0;--dim-f:#3a7ca5;--dim-p:#c27c2c}
:root[data-theme=dark]{--dim-u:#e8667a;--dim-s:#47b48a;--dim-c:#a97bd0;--dim-f:#5fa3cf;--dim-p:#e0a050}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--dim-u:#e8667a;--dim-s:#47b48a;--dim-c:#a97bd0;--dim-f:#5fa3cf;--dim-p:#e0a050}}
.final .final-top{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px 24px}
.final-sum{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:14px 22px;align-content:start}
.final-sum .final-val{grid-column:1/-1}
.final-val .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
.final-map #mapcard{border:0;padding:0;box-shadow:none;background:none;margin:0}
.final-map #map{min-height:430px;height:430px;flex:none}
.final-map .map-tools{flex-wrap:wrap}
.final-main{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;margin-top:16px;align-items:start}
#final-w{position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto;padding-right:4px}
#final-w h2{font-size:15px;margin:0 0 4px}
#final-w .fw-g{margin-bottom:4px}
#final-w .sl{grid-template-columns:1fr 30px;margin:3px 0}
#final-w .sl label{font-size:12.5px}
#final-w .fw-rep{margin-top:10px;font-size:12px}
.final-list{min-width:0}
.final-list #final-table{max-height:720px}
.final .card-h #final-presets{align-self:flex-start}
.tyb.sm{font-size:10px;padding:0 4px;min-width:0;opacity:.85}
.ftab td{padding:4px 6px}
.ftab .fbar{width:64px}
#p-strips h3{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:2px 0 4px;font-weight:600}
@media (max-width:1200px){.final .final-top{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){.final-main{grid-template-columns:minmax(0,1fr)}#final-w{position:static;max-height:none}}
.ivb{display:inline-block;font-size:11px;line-height:1.5;padding:0 6px;border-radius:9px;background:color-mix(in srgb,var(--c) 22%,transparent);border:1px solid var(--c);color:var(--ink);white-space:nowrap}
.ftypes.fiv{margin-top:10px}.ftypes.fiv th{font-weight:400}
.ivn{border:0;background:none;padding:1px 6px;border-radius:6px;cursor:pointer;color:var(--ink);font:inherit}.ivn:hover:not([disabled]){background:var(--wash)}.ivn.on{background:color-mix(in srgb,var(--now) 20%,transparent)}.ivn[disabled]{color:var(--muted);cursor:default}
.final-sum{grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr)}
.final-sum #final-types{overflow-x:auto}
.final-sum .ftypes{font-size:12.5px}
.final-sum .ftypes th{white-space:normal;vertical-align:bottom;line-height:1.2}
.final-sum .ftypes td{padding:3px 5px}

/* profile bar per KHG (one segment per dimension), sort chips, confidence dot, team mark, rank shift */
.pbar{display:flex;width:210px;height:12px;border-radius:3px;background:var(--grid);overflow:hidden;vertical-align:middle}
.pbar b{display:block;height:100%;border-right:1px solid var(--surface)}
.pbar b:last-child{border-right:0}
.phead{white-space:nowrap}
.pchip{display:inline-flex;align-items:center;gap:3px;margin-right:7px;cursor:pointer;font-weight:400;font-size:11.5px;color:var(--muted)}
.pchip.on{color:var(--ink);font-weight:600}
.pchip i{display:inline-block;width:9px;height:9px;border-radius:2px}
.cdot{color:var(--muted)}.tdia{color:var(--ink2)}
.ftab td.dl{color:var(--muted);font-size:12px}
#fshift{width:100%;display:block}
#fshift text{font-size:11px;fill:var(--ink2)}
#fshift text.bh{fill:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}

/* layout v3 (2026-11-17): map left, summary column right (types, type x intervention, rank shift); no matrix */
.final .final-top{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px 26px;align-items:stretch}
.final-map{display:flex;flex-direction:column;min-width:0}
.final-map #mapcard{display:flex;flex-direction:column;flex:1;height:100%}
.final-map #map{flex:1 1 auto;min-height:460px;height:auto}
.final-sum{display:flex;flex-direction:column;gap:14px;min-width:0}
.final-sum h3{margin:0 0 6px}
.final-sum #final-types{overflow-x:visible}
.final-sum .ftypes{width:100%;table-layout:auto;font-size:12.5px}
.final-sum .ftypes.fiv{margin-top:12px}
.final-sum .final-val{border-top:1px solid var(--grid);padding-top:10px}
.final-main{grid-template-columns:250px minmax(0,1fr);margin-top:22px;border-top:1px solid var(--grid);padding-top:16px}
.final-list #final-table{max-height:calc(100vh - 140px);min-height:560px}
.ftab td{vertical-align:middle}
#final-w .sl{grid-template-columns:minmax(0,1fr) 28px}
#final-w .sl input{min-width:0;width:100%}
#final-w .sl output{font-size:12px;color:var(--ink2);width:auto;min-width:0;justify-self:end}
#final-w .sl{gap:0 6px}
.ftab td small{display:inline;margin-left:6px}
.pbar{width:100%;min-width:200px;max-width:460px;height:13px}
@media (max-width:1200px){.final .final-top{grid-template-columns:minmax(0,1fr)}.final-map #map{min-height:420px}}
.ftab td:nth-child(3){white-space:normal;min-width:250px;max-width:400px}
.ftab td:nth-child(3) small{white-space:normal}
.pbar{min-width:130px}
.ftab{width:100%}
.ftab th.phead{white-space:normal;line-height:1.5}
.final .card-h{flex-wrap:wrap;gap:8px}
#final-table{overflow-x:auto}
#final-presets button,.final-map .map-tools button{white-space:nowrap}
#map-legend{display:flex;flex-wrap:wrap;gap:2px 12px}

/* profile layout (2026-11-17): indicators | land status, charts across the full width, licence holders | DMPG villages */
.p-mid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto auto 1fr;gap:16px 28px}
.p-mid .p-left,.p-mid #p-ov-panel{display:contents}
.p-mid #p-strips{grid-column:1;grid-row:1/5;align-self:start}
.p-mid #p-ov-panel>.ovhead{grid-column:2;grid-row:1}
.p-mid #p-ov-panel>.ovgrid{grid-column:2;grid-row:2}
.p-mid #p-ov-panel>.ov-tenure{grid-column:2;grid-row:3}
.p-mid #p-charts{grid-column:1/-1;grid-row:5;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-flow:row dense;margin-top:6px;border-top:1px solid var(--grid);padding-top:14px}
.p-mid #p-charts .ch.tall{grid-row:span 2}
.p-mid #p-charts .ch.wide{grid-column:span 2}
.p-mid #p-charts .ch.full{grid-column:1/-1}
.p-mid #p-ov-panel>.ov-lic{grid-column:1;grid-row:6;border-top:1px solid var(--grid);padding-top:12px}
.p-mid #p-ov-panel>.ov-vil{grid-column:2;grid-row:6;border-top:1px solid var(--grid);padding-top:12px}
.p-mid #p-ov-panel>.ov-lic:last-child{grid-column:1/-1}
.p-mid:has(#p-ov-panel:empty) #p-strips{grid-column:1/-1;grid-row:1}
@media (max-width:1180px){.p-mid{grid-template-columns:minmax(0,1fr)}
  .p-mid #p-strips,.p-mid #p-ov-panel>*,.p-mid #p-charts{grid-column:1/-1!important;grid-row:auto!important}
  .p-mid #p-charts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.p-mid #p-charts{grid-template-columns:minmax(0,1fr)}.p-mid #p-charts .ch.wide{grid-column:auto}}
.final-sum .ftypes{font-size:13.5px}
.final-sum .ftypes td{padding:7px 6px}
.final-sum .ftypes th{padding:4px 6px}
</style>
<style>
.tp{max-width:1680px;margin:0 auto;padding:0 20px 24px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.tp>*{min-width:0}
.tbar2{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end}
.tbar2 .ctl{display:flex;flex-direction:column;gap:4px}
.tbar2 .ctl>span{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tbar2 input[type=search]{min-width:240px}
.groups{display:flex;flex-wrap:wrap;gap:6px}
.gchip{border:1px solid var(--border);border-radius:999px;padding:2px 10px;font-size:12.5px;cursor:pointer;background:transparent;color:var(--ink2)}
.gchip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.rchips{display:flex;flex-wrap:wrap;gap:6px;min-height:0}
.rchip{border:1px solid var(--border);border-radius:999px;padding:1px 4px 1px 10px;font-size:12px;background:var(--wash)}
.rchip button{border:0;background:none;padding:0 4px;cursor:pointer;color:var(--muted)}
.sumrow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.sumrow .kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 12px}
.sumrow .kpi .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.sumrow .kpi .l{font-size:12px;color:var(--muted)}
.sumrow .kpi svg{display:block;width:100%;height:26px;margin-top:2px}
.twrap{overflow:auto;max-height:calc(100vh - 120px);border:1px solid var(--border);border-radius:10px;background:var(--surface)}
table.kt{border-collapse:separate;border-spacing:0;font-size:12.5px;font-variant-numeric:tabular-nums}
.kt thead th{position:sticky;top:0;z-index:3;background:var(--surface);vertical-align:bottom;text-align:left;font-weight:500;color:var(--ink2);padding:4px 6px 2px;border-bottom:1px solid var(--border);white-space:normal;min-width:92px;max-width:130px;line-height:1.2}
.kt thead tr.g th{top:0;z-index:4;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:0;padding-top:6px;text-align:left;min-width:0;border-left:1px solid var(--grid)}
.kt thead tr.h th{top:22px}
.kt thead th .lb{cursor:pointer;display:block;min-height:2.4em}
.kt thead th .lb.on{color:var(--ink);font-weight:650}
.kt thead th svg.hist{display:block;width:100%;height:26px;margin-top:3px;cursor:crosshair}
.kt td{padding:4px 6px;border-bottom:1px solid var(--grid);white-space:nowrap;text-align:right;position:relative}
.kt td.l{text-align:left}
.kt th.sticky,.kt td.sticky{position:sticky;left:0;z-index:2;background:var(--surface)}
.kt thead th.sticky{z-index:5}
.kt td.sticky{min-width:250px;max-width:300px;white-space:normal}
.kt tbody tr:hover td{background:var(--wash)}
.kt tbody tr{cursor:pointer}
.kt td small{display:block;color:var(--muted);font-size:11px}
.kt td .cb{position:absolute;left:6px;right:6px;bottom:2px;height:3px;border-radius:2px;background:var(--grid)}
.kt td .cb i{display:block;height:100%;border-radius:2px;background:var(--c,var(--hist));opacity:.75}
.kt td.na{color:var(--muted)}
.kt td svg.spark{display:block;width:96px;height:22px}
.kt .gstart{border-left:1px solid var(--grid)}
.pager{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.pager .seg button{min-width:2.2em}
.hbrush .selection{fill:var(--ink);fill-opacity:.12;stroke:var(--ink);stroke-opacity:.4}
@media (max-width:1100px){.sumrow{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>

  <div>

    <div class="pager" id="pager"></div>
  </section>
  <p class="hint" id="foot"></p>
</main>

  let s=(+v).toFixed(nd);if(s.indexOf(".")>=0)s=s.replace(/0+$/,"").replace(/\.$/,"");return dsep(s)};

function navHrefs(){const th=document.documentElement.dataset.theme;$$("nav.nav a[data-p]").forEach(a=>a.href=`${a.dataset.p}#l=${LANG}${th?"&t="+th:""}`)}
const tipEl=()=>document.getElementById("tip");
function showTip(e,html){const el=tipEl();if(html!==undefined)el.innerHTML=html;el.style.display="block";const w=el.offsetWidth,h=el.offsetHeight;
  let x=e.clientX+14,y=e.clientY+14;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;el.style.left=Math.max(4,x)+"px";el.style.top=Math.max(4,y)+"px"}

{const find=e=>e.target.closest?e.target.closest("[data-tip]"):null;

  document.addEventListener("mousemove",e=>{const el=find(e);if(el)showTip(e,el.dataset.tip)});

function readLangTheme(h){LANG=h.get("l")==="id"||h.get("l")==="en"?h.get("l"):((navigator.language||"").toLowerCase().startsWith("id")?"id":"en");

  v:j=>{const s=R.burned[j].slice(0,-1).filter(x=>x!=null);return s.length?d3.mean(s):null},spark:j=>R.burned[j],sc:"--hist",num:true,f:v=>fx(v,2)+"%"});
col({k:"sp_hs",g:"trend",label:"Hotspots, 2012 to 2026",tip:"VIIRS hotspots on peat per year. 2026 to date. Sorts by the total.",v:j=>{const s=R.hs[j].filter(x=>x!=null);return s.length?d3.sum(s):null},spark:j=>R.hs[j],sc:"--hist",num:true,f:v=>fmt(v,0)});
col({k:"sp_now",g:"trend",label:"Hotspots 2026 by month",tip:"MODIS hotspots on peat this year by month, medium and high confidence. Sorts by the total.",v:j=>{const s=R.now_m[j].filter(x=>x!=null);return s.length?d3.sum(s):null},spark:j=>R.now_m[j],sc:"--now",num:true,f:v=>fmt(v,0)});
GROUPS.unshift(["",""]);

// ---------------------------------------------------------------- state
const S={q:"",scope:"337",isl:"",type:new Set(),iv:new Set(),flag:"",rng:{},sk:"ru337",sd:1,page:0,ps:50,groups:new Set(["khg","scores","urgency","trend"])};
const ISL=[...new Set(R.isl)].filter(Boolean).sort();
const ext={};for(const c of COLS)if(c.num){const v=[];for(let j=0;j<N;j++){const x=c.v(j);if(x!=null&&isFinite(x))v.push(x)}v.sort((a,b)=>a-b);
  c.lo=v.length?v[0]:0;c.hi=v.length?(c.bar01?1:d3.quantile(v,.95)||v[v.length-1]):1;c.all=v;c.min=v[0];c.max=v[v.length-1]}
function rowsFiltered(except){const q=S.q.trim().toLowerCase();const out=[];
  for(let j=0;j<N;j++){
    if(S.scope==="337"&&!R.k337[j])continue;if(S.scope==="team"&&!R.team[j])continue;if(S.scope==="362"&&!R.k362[j])continue;if(S.scope==="scored"&&!R.type[j])continue;
    if(S.isl&&R.isl[j]!==S.isl)continue;if(S.type.size&&!S.type.has(R.type[j]))continue;if(S.iv.size&&!S.iv.has(R.iv[j]))continue;
    if(S.flag==="lowf"&&!R.lowf[j])continue;if(S.flag==="hix"&&!R.hix[j])continue;if(S.flag==="wk"&&!R.wk[j])continue;
    if(q&&!(R.name[j].toLowerCase().includes(q)||R.id[j].toLowerCase().includes(q)||R.prov[j].toLowerCase().includes(q)||(R.tim[j]||"").toLowerCase().includes(q)))continue;
    let ok=true;for(const [k,[a,b]] of Object.entries(S.rng)){if(k===except)continue;const c=COLS.find(c=>c.k===k);const v=c.v(j);if(v==null||v<a||v>b){ok=false;break}}
    if(ok)out.push(j)}
  return out}
const visCols=()=>COLS.filter(c=>S.groups.has(c.g));

// ---------------------------------------------------------------- controls
function segH(opts,cur,attr){return `<span class="seg">${opts.map(([v,l,tp])=>`<button type="button" data-${attr}="${v}" class="${cur(v)?"on":""}"${tipAttr(tp?t(tp):"")}>${esc(t(l))}</button>`).join("")}</span>`}
function buildBar(){
  const h=[];
  h.push(`<label class="ctl"><span>${esc(t("Search"))}</span><input type="search" id="q" value="${esc(S.q)}" placeholder="${esc(t("KHG name, code, province or Tim"))}"></label>`);
  h.push(`<div class="ctl"><span>${esc(t("Show"))}</span>${segH([["337","KLH 337","KLH's 337 priority KHG."],["team","Team KHG","KHG chosen by the project team (main and reserve)."],["362","PPEG 362","The 362 priority KHG of KLH's PPEG analysis."],["scored","All scored","Every KHG with a type."],["all","All 865","Every KHG."]],v=>S.scope===v,"scope")}</div>`);
  h.push(`<div class="ctl"><span>${esc(t("Island"))}</span>${segH([["","All"],...ISL.map(i=>[i,i.replace(/^Pulau /,"")])],v=>S.isl===v,"isl")}</div>`);
  h.push(`<div class="ctl"><span>${esc(t("Type"))}</span><span class="seg">${TYPE_ORDER.map(ty=>`<button type="button" data-ty="${ty}" class="${S.type.has(ty)?"on":""}"${tipAttr(`<b>${ty} ${esc(t(TYPE_LABEL[ty]))}</b><br>${esc(t(TYPE_RULE[ty]))}`)}>${ty}</button>`).join("")}</span></div>`);
  h.push(`<div class="ctl"><span>${esc(t("Intervention"))}</span><span class="seg">${IV_ORDER.map(v=>`<button type="button" data-iv="${v}" class="${S.iv.has(v)?"on":""}">${esc(t(IV_SHORT[v]))}</button>`).join("")}</span></div>`);
  h.push(`<div class="ctl"><span>${esc(t("Flag"))}</span>${segH([["","All"],["lowf","Low feasibility"],["hix","High exposure"],["wk","Whole KHG","No peat in KLH's peat map: scored with the whole KHG as peat."]],v=>S.flag===v,"flag")}</div>`);
  h.push(`<div class="ctl"><span>${esc(t("Columns"))}</span><div class="groups">${GROUPS.filter(g=>g[0]).map(([g,l])=>`<button type="button" class="gchip${S.groups.has(g)?" on":""}" data-g="${g}">${esc(t(l))}</button>`).join("")}</div></div>`);
  h.push(`<div class="ctl"><span>&nbsp;</span><button type="button" id="reset" class="ghost">${esc(t("Reset"))}</button></div>`);
  $("#tbar").innerHTML=h.join("");
  $("#q").oninput=e=>{S.q=e.target.value;S.page=0;render(false)};
  $$("#tbar [data-scope]").forEach(b=>b.onclick=()=>{S.scope=b.dataset.scope;S.page=0;update()});
  $$("#tbar [data-isl]").forEach(b=>b.onclick=()=>{S.isl=b.dataset.isl;S.page=0;update()});
  $$("#tbar [data-ty]").forEach(b=>b.onclick=()=>{const v=b.dataset.ty;S.type.has(v)?S.type.delete(v):S.type.add(v);S.page=0;update()});
  $$("#tbar [data-iv]").forEach(b=>b.onclick=()=>{const v=b.dataset.iv;S.iv.has(v)?S.iv.delete(v):S.iv.add(v);S.page=0;update()});
  $$("#tbar [data-flag]").forEach(b=>b.onclick=()=>{S.flag=b.dataset.flag;S.page=0;update()});
  $$("#tbar [data-g]").forEach(b=>b.onclick=()=>{const g=b.dataset.g;S.groups.has(g)?S.groups.delete(g):S.groups.add(g);if(!S.groups.size)S.groups.add("khg");update()});
  $("#reset").onclick=()=>{Object.assign(S,{q:"",scope:"337",isl:"",type:new Set(),iv:new Set(),flag:"",rng:{},sk:"ru337",sd:1,page:0});update()};
}
function rangeChips(){
  $("#rchips").innerHTML=Object.entries(S.rng).map(([k,[a,b]])=>{const c=COLS.find(c=>c.k===k);return `<span class="rchip">${esc(t(c.label))}: ${esc(c.f?c.f(a):fmt(a))} – ${esc(c.f?c.f(b):fmt(b))}<button type="button" data-k="${k}" aria-label="${esc(t("Remove"))}">×</button></span>`}).join("");
  $$("#rchips button").forEach(b=>b.onclick=()=>{delete S.rng[b.dataset.k];S.page=0;update()});
  $("#rchips").style.marginTop=Object.keys(S.rng).length?"10px":"0"}

// ---------------------------------------------------------------- summary
function spark(vals,colorVar,w=96,h=22,area=true){
  const v=vals.map(x=>x==null?null:+x);const n=v.length;if(!n||v.every(x=>x==null))return `<svg class="spark" viewBox="0 0 ${w} ${h}"></svg>`;
  const mx=Math.max(1e-9,...v.filter(x=>x!=null));const X=i=>1+i*(w-2)/Math.max(1,n-1),Y=x=>h-2-(x/mx)*(h-4);
  let d="",a="";v.forEach((x,i)=>{if(x==null)return;d+=(d?"L":"M")+X(i).toFixed(1)+","+Y(x).toFixed(1)});
  const pts=v.map((x,i)=>x==null?null:[X(i),Y(x)]).filter(Boolean);if(area&&pts.length>1)a=`<path d="M${pts[0][0]},${h-1}L${pts.map(p=>p.join(",")).join("L")}L${pts[pts.length-1][0]},${h-1}Z" fill="${css(colorVar)}" opacity=".15"/>`;
  const last=pts[pts.length-1];return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${a}<path d="${d}" fill="none" stroke="${css(colorVar)}" stroke-width="1.3"/><circle cx="${last[0]}" cy="${last[1]}" r="1.8" fill="${css(colorVar)}"/></svg>`}
function summary(idx){
  const sum=(arr)=>d3.sum(idx,j=>arr[j]||0);
  const byY=(key,ny)=>d3.range(ny).map(i=>d3.sum(idx,j=>(R[key][j][i]||0)*((key==="burned")?(R.ind.peat_km2[j]||0):1)));
  const burnKm=byY("burned",DATA.years.burned.length).map(x=>x/100);
  const hs=byY("hs",DATA.years.hs.length),nowm=d3.range(12).map(i=>d3.sum(idx,j=>R.now_m[j][i]||0));
  const k=[[fmt(idx.length,0),t("KHG shown"),""],
    [fmt(sum(R.ind.peat_km2),0),t("km2 of peat"),""],
    [fmt(d3.sum(idx,j=>R.ind.pop_on_peat?R.ind.pop_on_peat[j]||0:0),0),t("people on the peat"),""],
    [fmt(d3.sum(burnKm.slice(0,-1)),0),t("km2 of peat burned, 2015 to 2025"),spark(burnKm,"--hist",200,26)],
    [fmt(d3.sum(hs),0),t("VIIRS hotspots on peat, 2012 to 2026"),spark(hs,"--hist",200,26)],
    [fmt(d3.sum(nowm),0),t("hotspots this year (MODIS)"),spark(nowm.slice(0,Math.max(1,nowm.findLastIndex(x=>x>0)+1)),"--now",200,26)]];
  $("#sum").innerHTML=k.map(([v,l,s])=>`<div class="kpi"><div class="v">${v}</div><div class="l">${esc(l)}</div>${s}</div>`).join("")}

// ---------------------------------------------------------------- table
function histSvg(c,idxAll,idxOther){
  const W=110,H=26,B=18,lo=c.min,hi=c.bar01?1:(c.max>c.hi*3?c.hi:c.max);if(lo==null||hi==null||hi<=lo)return "";
  const bin=x=>Math.max(0,Math.min(B-1,Math.floor((Math.min(x,hi)-lo)/(hi-lo)*B)));
  const a=new Array(B).fill(0),b=new Array(B).fill(0);
  for(const x of c.all)a[bin(x)]++;for(const j of idxOther){const x=c.v(j);if(x!=null&&isFinite(x))b[bin(x)]++}
  const mx=Math.max(1,...a),bw=W/B;
  const r=S.rng[c.k];
  return `<svg class="hist" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" data-k="${c.k}" data-lo="${lo}" data-hi="${hi}">`+
    a.map((n,i)=>`<rect x="${i*bw+.5}" width="${bw-1}" y="${H-1-(H-2)*Math.sqrt(n/mx)}" height="${(H-2)*Math.sqrt(n/mx)}" fill="${css("--grid")}"/>`).join("")+
    b.map((n,i)=>n?`<rect x="${i*bw+.5}" width="${bw-1}" y="${H-1-(H-2)*Math.sqrt(n/mx)}" height="${(H-2)*Math.sqrt(n/mx)}" fill="${c.color&&c.color.startsWith("var")?css(c.color.slice(4,-1)):css("--hist")}" opacity=".8"/>`:"").join("")+
    (r?`<rect x="${(Math.max(r[0],lo)-lo)/(hi-lo)*W}" width="${Math.max(1,(Math.min(r[1],hi)-Math.max(r[0],lo))/(hi-lo)*W)}" y="0" height="${H}" fill="${css("--ink")}" opacity=".08"/>`:"")+`</svg>`}
function cell(c,j){
  if(c.spark){const v=c.v(j);return `<td${tipAttr(`${esc(R.name[j])}<br>${esc(t(c.label))}: ${esc(c.f(v))}`)}>${spark(c.spark(j),c.sc)}</td>`}
  if(c.html)return `<td class="l">${c.html(j)}</td>`;
  const v=c.v(j);
  if(c.txt)return `<td class="l">${c.f?c.f(v):esc(v??"")}</td>`;
  if(v==null||!isFinite(v))return `<td class="na">${esc(t("n/a"))}</td>`;
  const w=c.hi>c.lo?Math.max(0,Math.min(1,(v-Math.min(0,c.lo))/(c.hi-Math.min(0,c.lo)))):0;
  return `<td>${esc(c.f?c.f(v):fmt(v))}${c.k==="conf"||c.k==="ru"||c.k==="ru337"?"":`<span class="cb"><i style="width:${(w*100).toFixed(1)}%;--c:${c.color||"var(--hist)"}"></i></span>`}</td>`}
let IDX=[];
function render(full=true){
  const idx=rowsFiltered();IDX=idx;
  const c0=COLS.find(c=>c.k===S.sk)||COLS[0];
  const key=j=>{const v=c0.v(j);return v==null||(typeof v==="number"&&!isFinite(v))?null:v};
  idx.sort((a,b)=>{const x=key(a),y=key(b);if(x==null&&y==null)return a-b;if(x==null)return 1;if(y==null)return -1;return (x<y?-1:x>y?1:0)*S.sd||a-b});
  const ps=S.ps==="all"?idx.length||1:S.ps,np=Math.max(1,Math.ceil(idx.length/ps));S.page=Math.min(S.page,np-1);
  const pageIdx=idx.slice(S.page*ps,S.page*ps+ps);
  const cols=visCols();
  const grp=[];for(const c of cols){if(grp.length&&grp[grp.length-1][0]===c.g)grp[grp.length-1][1]++;else grp.push([c.g,1])}
  const gl=g=>esc(t((GROUPS.find(x=>x[0]===g)||[0,g])[1]));
  const firstOf=new Set();{let prev=null;for(const c of cols){if(c.g!==prev)firstOf.add(c.k);prev=c.g}}
  const head=`<thead><tr class="g"><th class="sticky"></th>${grp.map(([g,n])=>`<th colspan="${n}">${gl(g)}</th>`).join("")}</tr><tr class="h"><th class="sticky"><span class="lb${S.sk==="name"?" on":""}" data-k="name">${esc(t("KHG"))}${S.sk==="name"?(S.sd>0?" ▴":" ▾"):""}</span><small class="hint">${esc(t("● high ◐ medium ○ low data confidence · ◆ team KHG"))}</small></th>`+
    cols.map(c=>{const others=c.num?rowsFiltered(c.k):[];return `<th class="${firstOf.has(c.k)?"gstart":""}"><span class="lb${S.sk===c.k?" on":""}" data-k="${c.k}"${tipAttr(`<b>${esc(t(c.label))}</b>${c.tip?"<br>"+t(c.tip):""}<br><span>${esc(t(c.num?"Click to sort. Drag on the histogram to filter a range.":"Click to sort."))}</span>`)}>${esc(t(c.label))}${S.sk===c.k?(S.sd>0?" ▴":" ▾"):""}</span>${c.num&&!c.spark&&c.k!=="ru"&&c.k!=="ru337"&&c.k!=="conf"?histSvg(c,idx,others):""}</th>`}).join("")+`</tr></thead>`;
  const body=`<tbody>${pageIdx.map(j=>`<tr data-id="${R.id[j]}"><td class="sticky l"${tipAttr(t("Open the profile of this KHG in the KHG priority page."))}>${R.conf[j]!=null?`<span style="color:var(--muted)">${confChar[R.conf[j]]}</span> `:""}${esc(R.name[j])}${R.team[j]?` <span${tipAttr(t("Team KHG")+": "+esc(R.team[j]))}>◆</span>`:""}<small>${esc(R.id[j])} · ${esc(R.prov[j])}${R.k337[j]?"":" · "+esc(t("not in the 337"))}${R.wk[j]?" · "+esc(t("whole KHG used")):""}</small></td>${cols.map(c=>cell(c,j)).join("")}</tr>`).join("")}</tbody>`;
  $("#twrap").innerHTML=`<table class="kt">${head}${body}</table>`;
  $$("#twrap .lb").forEach(h=>h.onclick=()=>{const k=h.dataset.k;const c=COLS.find(c=>c.k===k);S.sd=S.sk===k?-S.sd:(c&&c.num&&!c.asc?-1:1);S.sk=k;render()});
  $$("#twrap tbody tr").forEach(tr=>tr.onclick=e=>{if(e.target.closest("[data-tip]")&&e.target.closest(".tyb,.ivb"))return;location.href=`dashboard.html#l=${LANG}${document.documentElement.dataset.theme?"&t="+document.documentElement.dataset.theme:""}&k=${tr.dataset.id}`});
  $$("#twrap svg.hist").forEach(svgEl=>{const k=svgEl.dataset.k,lo=+svgEl.dataset.lo,hi=+svgEl.dataset.hi;
    const s=d3.select(svgEl),W=110,H=26,x=d3.scaleLinear([0,W],[lo,hi]);
    const br=d3.brushX().extent([[0,0],[W,H]]).on("end",ev=>{if(!ev.sourceEvent)return;if(!ev.selection){delete S.rng[k]}else{const [a,b]=ev.selection.map(x);S.rng[k]=[a,b>=hi-1e-12?Infinity:b];if(a<=lo+1e-12)S.rng[k][0]=-Infinity}S.page=0;update()});
    s.append("g").attr("class","hbrush").call(br)});
  pager(idx.length,np,ps);
  if(full){summary(idx);rangeChips()}else summary(idx);
  hash()}
function pager(n,np,ps){
  const from=n?S.page*ps+1:0,to=Math.min(n,S.page*ps+ps);
  const pages=[];for(let p=0;p<np;p++)if(p<2||p>np-3||Math.abs(p-S.page)<=2)pages.push(p);else if(pages[pages.length-1]!=="…")pages.push("…");
  const h=`<span class="hint">${esc(t("{a}–{b} of {n} KHG",{a:fmt(from,0),b:fmt(to,0),n:fmt(n,0)}))}</span>
    <span class="seg">${[25,50,100,"all"].map(v=>`<button type="button" data-ps="${v}" class="${S.ps===v?"on":""}">${v==="all"?esc(t("All")):v}</button>`).join("")}</span>
    <span class="seg">${`<button type="button" data-pg="${S.page-1}" ${S.page?"":"disabled"}>‹</button>`+pages.map(p=>p==="…"?`<button type="button" disabled>…</button>`:`<button type="button" data-pg="${p}" class="${p===S.page?"on":""}">${p+1}</button>`).join("")+`<button type="button" data-pg="${S.page+1}" ${S.page<np-1?"":"disabled"}>›</button>`}</span>`;
  for(const id of ["#pager","#pager-top"])$(id).innerHTML=h;
  $$(".pager [data-ps]").forEach(b=>b.onclick=()=>{S.ps=b.dataset.ps==="all"?"all":+b.dataset.ps;S.page=0;render()});
  $$(".pager [data-pg]").forEach(b=>b.onclick=()=>{S.page=+b.dataset.pg;render();$("#twrap").scrollTop=0})}

// ---------------------------------------------------------------- CSV, hash, init
function csv(){
  const cols=COLS.filter(c=>!c.spark);const q=v=>{const s=v==null?"":String(v);return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s};
  const head=["khg_code","khg_name","provinces","klh_337","team_khg",...cols.map(c=>c.k.replace(/^d_/,""))];
  const lines=[head.join(",")].concat(IDX.map(j=>[R.id[j],R.name[j],R.prov[j],R.k337[j],R.team[j],...cols.map(c=>c.v(j))].map(q).join(",")));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv"}));a.download="khg_table.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function hash(){const th=document.documentElement.dataset.theme;
  const h=`#l=${LANG}${th?"&t="+th:""}&s=${S.scope}${S.isl?"&i="+encodeURIComponent(S.isl):""}${S.type.size?"&ty="+[...S.type].join(""):""}${S.flag?"&f="+S.flag:""}&k=${S.sk}&d=${S.sd}&g=${[...S.groups].join(",")}`;
  history.replaceState(null,"",h);navHrefs()}
function readHash(){const h=new URLSearchParams(location.hash.slice(1));readLangTheme(h);
  if(["337","team","362","scored","all"].includes(h.get("s")))S.scope=h.get("s");if(h.get("i"))S.isl=h.get("i");if(h.get("ty"))S.type=new Set(h.get("ty").split("").filter(x=>TYPE_ORDER.includes(x)));
  if(["lowf","hix","wk"].includes(h.get("f")))S.flag=h.get("f");if(h.get("k")&&(h.get("k")==="name"||COLS.some(c=>c.k===h.get("k"))))S.sk=h.get("k");if(h.get("d")==="-1")S.sd=-1;
  if(h.get("g")){const g=h.get("g").split(",").filter(x=>GROUPS.some(y=>y[0]===x));if(g.length)S.groups=new Set(g)}}
COLS.push({k:"name",g:"_",v:j=>R.name[j],txt:true});
function update(){topBar("khg_table.html",update);document.title=t("KHG table");
  $("#sub").textContent=t("Every KHG with every field of the prioritisation: filter, sort, and drag on a column's histogram to keep a range. Click a row to open its profile.");
  $("#foot").textContent=t("Scores and types from the prioritisation run of {r}; fire data to {d}. Histograms: grey is every KHG, colour is the KHG that pass the other filters. Sparklines share no scale: each shows the shape of one KHG's series.",{r:M.run||"",d:(M.period_now||"").toString()});
  $("#csv-btn").onclick=csv;buildBar();render()}
readHash();update();
document.body.dataset.ready="1";

})();</script>
