# KHG Sungai Balangan - Sungai Batangalai (KHG.63.07-08-11.01): settings of the full RE-PEAT chain for this KHG; shared settings in re-peat/pipeline.yaml.
# Written by `python tools/khg_pipeline.py init` on 2026-10-27 from the data found then (01_dem/inputs/manifest.csv, the peat-depth
# rasters in the data folder). Edit freely: `init` keeps this file unless --overwrite is given.
#   dems.<dem>.skip      the variant does not run, with the reason
#   peat_depth: null     no peat-depth raster covers the KHG; the criterion gets weight 0
#   overrides            any pipeline.yaml step key for this KHG only, e.g. {delineation: {min_area_km2: 50}}
khg:
  code: 63.07-08-11.01
  name: KHG Sungai Balangan - Sungai Batangalai
  folder: 63.07-08-11.01_balangan_batangalai
  province: Kalimantan Selatan
  role: main
dems:
  lidar:
    skip: no LiDAR in the data folder covers the KHG
  deltadtm:
    product: deltadtm
    clip: ${REPEAT_KHG}/63.07-08-11.01_balangan_batangalai/01_dem/inputs/deltadtm.tif
    cover_pct: 97.9
    sources:
    - ${REPEAT_DATA}/dem/open/deltadtm/deltadtm_v1-1_Balangan_Batangalai.tif
  demnas:
    product: demnas
    clip: ${REPEAT_KHG}/63.07-08-11.01_balangan_batangalai/01_dem/inputs/demnas.tif
    cover_pct: 100.0
    sources:
    - ${REPEAT_DATA}/dem/demnas_tiles/DEMNAS_1713-33_v1.0.tif
    - ${REPEAT_DATA}/dem/demnas_tiles/DEMNAS_1713-34_v1.0.tif
    - ${REPEAT_DATA}/dem/demnas_tiles/DEMNAS_1713-61_v1.0.tif
    - ${REPEAT_DATA}/dem/demnas_tiles/DEMNAS_1713-62_v1.0.tif
peat_depth:
  path: ${REPEAT_DATA}/Peat depth and DTM/PeatDepth_Kalimantan/06_Kalimantan Selatan/Peat_depth_clip_Sungai_Balangan_Sungai_Batangalai.img
  scale: 0.01
  valid_share: 0.534
canals:
  class_field: KET_KANAL
overrides: {}
