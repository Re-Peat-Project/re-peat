# Sungai Kampar - Sungai Gaung (KHG 71), step 4: the sub-KHG ranking, baseline 2019-2021.
# A test run: Sentinel-2 at 60 m. Needs steps 1-3 first. Environment variables: REPEAT_DATA, SITMAT_PROCESSED.
#   repeat-subkhg --config ../re-peat/sites/14.02-04-05.01_kampar_gaung/subkhg.yaml --fetch-only    # cloud layers, once
#   repeat-subkhg --config ../re-peat/sites/14.02-04-05.01_kampar_gaung/subkhg.yaml --skip-fetch    # score
khg: ${REPEAT_KHG}/14.02-04-05.01_kampar_gaung/00_inputs/khg.gpkg
khg_id_field: khg_id
units: {mode: vector, path: "${REPEAT_KHG}/14.02-04-05.01_kampar_gaung/02_delineation/subkhg_units.gpkg"}
years: {baseline: [2015, 2022], validation: [2023], elnino: [2015, 2019]}   # 2015 on: Permen LHK 7/2022 counts land burnt since 2015; 2023 (El Nino) held out to test the ranking
cache_dir: ${REPEAT_KHG}/14.02-04-05.01_kampar_gaung/cache
out: ${REPEAT_KHG}/14.02-04-05.01_kampar_gaung/04_prioritisation
rasters:
  dtm: "${REPEAT_DATA}/Peat depth and DTM/DTM_Sumatera-002/RIAU/DTM_Sungai_Kampar_Sungai_Gaung.tif"
  peat_depth: "${REPEAT_DATA}/Peat depth and DTM/PeatDepth_Sumatera/RIAU/Peat_depth_model_KHG_Sungai_Kampar_Sungai_Guang.img"
params:
  peat_depth_scale: 0.01                    # cm to m
  ipg_canal_class_field: KET_KANAL
  ipg_canal_classes: ["Kanal Primer", "Kanal Sekunder"]   # canals that need blocks (metrik IPG)
vectors:
  canals: ${REPEAT_KHG}/14.02-04-05.01_kampar_gaung/00_inputs/canals.gpkg
  rivers: ${REPEAT_KHG}/14.02-04-05.01_kampar_gaung/00_inputs/rivers.gpkg
  blocks: ${REPEAT_KHG}/14.02-04-05.01_kampar_gaung/00_inputs/blocks.gpkg             # existing canal blocks only (REALISASI)
  protected: {path: "${REPEAT_DATA}/landstatus/FEG__Indonesia__2017__Rev_Tipologi.gpkg", field: FEG_KGHLTR, values: ["Indikatif Fungsi Lindung E.G."]}   # peat ecosystem with protected function (FEG 2017), i_protected
tma: {path: "${SITMAT_PROCESSED}", period: ["2026-04-01", "2026-10-15"]}   # the current water-table state
sources: {ndmi: {res_m: 20}, burned: {enabled: false}, firms: {enabled: false}, deficit: {enabled: false}}   # NDMI/NDVI at Sentinel-2's native 20 m; burnt area, hotspots and climate come from national_layers and repeat-neraca, so their cloud fetches are off
extra_indicators: ["${REPEAT_KHG}/14.02-04-05.01_kampar_gaung/03_neraca/runs/balance/neraca_balance_unit.csv"]    # repeat_neraca.balance: u_wb_mean, u_deficit_months, p_minus_et_mean_mm; left empty where balance_stable_ok = 0; need-score weight 0
scoring: {ranksum_columns: {u_wb_daily_mean: p_minus_et_mean_mm}, ranksum_weights: {u_deficit_months: 0}}     # the slide's water-balance slot reads P - ET with KHG-mean rain (the water signal between sub-KHG); u_deficit_months is left out because its order between units follows land cover (repeat-neraca/docs/reports/balance_design.md)
# for repeat-pump (subkhg_priority.csv in the output folder): the KHG deficit from repeat-neraca and the delivery period in days
priority_export: {neraca_khg: "${REPEAT_KHG}/14.02-04-05.01_kampar_gaung/03_neraca/runs/deficit/neraca_khg.csv", design_period_days: null}
national_layers: {config: ../repeat-prioritisation/configs/examples/national_profile.yaml}   # fire (burnt-area polygons, VIIRS, KLH 2026 hotspots) and canals by class, counted as in the national profile (subkhg/national_layers.py)
